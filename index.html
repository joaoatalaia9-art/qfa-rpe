<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0a14">
<title>QFA RPE Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#1a0a14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}

/* SCREENS */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:#1a0a14;transition:opacity 0.2s;}
.screen.hidden{opacity:0;pointer-events:none;}

/* HEADER */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,0.05);border-bottom:1px solid rgba(255,255,255,0.1);flex-shrink:0;flex-wrap:wrap;}
.hdr-logo{width:38px;height:38px;object-fit:contain;border-radius:5px;flex-shrink:0;}
.hdr-title h1{font-size:14px;font-weight:700;}
.hdr-title p{font-size:9px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.date-pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:5px 10px;}
.date-pill label{font-size:9px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.8px;}
.date-pill input{background:transparent;border:none;color:#fff;font-size:11px;font-weight:600;outline:none;color-scheme:dark;cursor:pointer;width:105px;}
.hbtn{border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;white-space:nowrap;}
.hbtn-add{background:rgba(200,0,60,0.2);border-color:rgba(200,0,60,0.5);color:#ff88aa;}
.hbtn-csv{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);}

/* STATS */
.stats{display:flex;background:rgba(0,0,0,0.3);border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0;}
.stat{flex:1;text-align:center;padding:6px 4px;border-right:1px solid rgba(255,255,255,0.07);}
.stat:last-child{border-right:none;}
.sv{font-size:17px;font-weight:800;color:#c8003c;display:block;}
.sl{font-size:9px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.5px;}

/* GRID */
.grid-wrap{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch;}
.grid-wrap::-webkit-scrollbar{display:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;}

/* CARD */
.card{background:#2a1020;border:2px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform 0.12s,border-color 0.2s;position:relative;}
.card:active{transform:scale(0.95);}
.card.done{border-color:#00c864;background:#0d2018;}
.card-photo{width:100%;aspect-ratio:1;object-fit:cover;object-position:top center;display:block;}
.card-badge{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:7px;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.card.done .card-badge{display:flex;}
.card-name{padding:5px 5px 7px;font-size:10px;font-weight:600;text-align:center;color:rgba(255,255,255,0.88);line-height:1.2;}
.card.done .card-name{color:#00c864;}

/* RPE SCREEN */
.rpe-hdr{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,0.05);border-bottom:1px solid rgba(255,255,255,0.1);flex-shrink:0;}
.back-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rpe-pp{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:top center;border:2px solid #c8003c;flex-shrink:0;}
.rpe-pname{font-size:16px;font-weight:700;}
.rpe-psub{font-size:10px;color:rgba(255,255,255,0.4);margin-top:1px;}

.rpe-body{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch;}
.rpe-body::-webkit-scrollbar{display:none;}
.rpe-lbl-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.35);margin-bottom:10px;}

.rpe-opts{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;}
.rpe-opt{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;cursor:pointer;border:2px solid transparent;background:rgba(255,255,255,0.04);transition:all 0.12s;}
.rpe-opt:active{transform:scale(0.98);}
.rpe-opt.sel{background:rgba(255,255,255,0.09);}
.rpe-num{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;}
.rpe-text{font-size:13px;font-weight:500;color:rgba(255,255,255,0.9);}

.sub-btn{width:100%;padding:15px;background:linear-gradient(135deg,#8b0035,#c8003c);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.sub-btn:disabled{opacity:0.3;cursor:not-allowed;}
.sub-btn:not(:disabled):active{opacity:0.85;}

/* MODALS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;display:none;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:#200c16;border:1px solid rgba(200,0,60,0.35);border-radius:16px;padding:22px;width:290px;max-width:90vw;}
.modal h3{font-size:15px;font-weight:700;margin-bottom:3px;}
.modal-sub{font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:16px;}
.photo-ring{width:76px;height:76px;border-radius:50%;border:2px dashed rgba(200,0,60,0.4);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0 auto 14px;background:rgba(255,255,255,0.04);}
.photo-ring img{width:100%;height:100%;object-fit:cover;object-position:top center;}
.ph-ph{display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(255,255,255,0.3);font-size:9px;text-transform:uppercase;}
.ph-ph span{font-size:22px;}
.mfield{margin-bottom:11px;}
.mfield label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.38);margin-bottom:5px;}
.mfield input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);border-radius:7px;padding:8px 11px;color:#fff;font-size:13px;outline:none;-webkit-appearance:none;}
.mfield input:focus{border-color:rgba(200,0,60,0.5);}
.merr{font-size:11px;color:#ff6688;min-height:13px;margin-top:4px;}
.mbtns{display:flex;gap:8px;margin-top:14px;}
.mbc{flex:1;padding:9px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:7px;color:rgba(255,255,255,0.55);font-size:12px;cursor:pointer;}
.mbs{flex:2;padding:9px;background:linear-gradient(135deg,#8b0035,#c8003c);border:none;border-radius:7px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);padding:9px 20px;border-radius:40px;font-size:13px;font-weight:700;color:#fff;transition:transform 0.28s;z-index:999;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>

/* ── GRID ── */
function buildGrid() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (var i = 0; i < players.length; i++) {
    (function(idx) {
      var name = players[idx];
      var sub  = subs[name];
      var card = document.createElement('div');
      card.className = 'card' + (sub ? ' done' : '');
      card.id = 'card' + idx;

      var img = document.createElement('img');
      img.className = 'card-photo';
      img.src = photos[name] || '';
      img.alt = name;

      var badge = document.createElement('div');
      badge.className = 'card-badge';
      badge.id = 'badge' + idx;
      if (sub) { badge.style.background = sub.color; badge.textContent = sub.rpe; }

      var nm = document.createElement('div');
      nm.className = 'card-name';
      nm.textContent = name;

      card.appendChild(img);
      card.appendChild(badge);
      card.appendChild(nm);

      card.addEventListener('click', function() { openRPE(idx); });
      grid.appendChild(card);
    })(i);
  }
  updateStats();
}

/* ── OPEN RPE ── */
function openRPE(idx) {
  activeIdx = idx;
  selRPE = 0; selColor = '';
  var name = players[idx];

  document.getElementById('rpeName').textContent = name;
  document.getElementById('rpePhoto').src = photos[name] || '';

  // build RPE options
  var opts = document.getElementById('rpeOpts');
  opts.innerHTML = '';
  for (var i = 0; i < RPE.length; i++) {
    (function(r) {
      var opt = document.createElement('div');
      opt.className = 'rpe-opt';
      opt.id = 'ropt' + r.v;

      var num = document.createElement('div');
      num.className = 'rpe-num';
      num.style.background = r.c;
      num.textContent = r.v;

      var txt = document.createElement('div');
      txt.className = 'rpe-text';
      txt.textContent = r.l;

      opt.appendChild(num);
      opt.appendChild(txt);

      opt.addEventListener('click', function() {
        document.querySelectorAll('.rpe-opt').forEach(function(o) {
          o.classList.remove('sel');
          o.style.borderColor = 'transparent';
        });
        opt.classList.add('sel');
        opt.style.borderColor = r.c;
        selRPE = r.v;
        selColor = r.c;
        document.getElementById('subBtn').disabled = false;
      });
      opts.appendChild(opt);
    })(RPE[i]);
  }

  document.getElementById('subBtn').disabled = true;

  // pre-select if already submitted
  var sub = subs[name];
  if (sub) {
    selRPE = sub.rpe; selColor = sub.color;
    var pre = document.getElementById('ropt' + sub.rpe);
    if (pre) { pre.classList.add('sel'); pre.style.borderColor = sub.color; document.getElementById('subBtn').disabled = false; }
  }

  document.getElementById('gridScreen').classList.add('hidden');
  document.getElementById('rpeScreen').classList.remove('hidden');
}

function goBack() {
  document.getElementById('rpeScreen').classList.add('hidden');
  document.getElementById('gridScreen').classList.remove('hidden');
}

/* ── SUBMIT ── */
document.getElementById('subBtn').addEventListener('click', function() {
  if (activeIdx < 0 || selRPE === 0) return;
  var name = players[activeIdx];
  var date = document.getElementById('dateInput').value;
  var lbl  = '';
  for (var i = 0; i < RPE.length; i++) { if (RPE[i].v === selRPE) { lbl = RPE[i].l; break; } }
  subs[name] = { name: name, rpe: selRPE, color: selColor, label: lbl, date: date };

  // update card
  var card = document.getElementById('card' + activeIdx);
  if (card) {
    card.classList.add('done');
    var badge = document.getElementById('badge' + activeIdx);
    if (badge) { badge.style.background = selColor; badge.textContent = selRPE; }
    card.querySelector('.card-name').style.color = '#00c864';
  }

  updateStats();
  showToast('✓ ' + name + ' — RPE ' + selRPE + ' (' + lbl + ')');
  goBack();
});

document.getElementById('backBtn').addEventListener('click', goBack);

/* ── STATS ── */
function updateStats() {
  var done = Object.keys(subs).length;
  document.getElementById('stDone').textContent = done;
  document.getElementById('stLeft').textContent = players.length - done;
  if (done) {
    var sum = 0;
    for (var k in subs) sum += subs[k].rpe;
    var avg = sum / done;
    document.getElementById('stAvg').textContent = avg % 1 === 0 ? avg : avg.toFixed(1);
  } else {
    document.getElementById('stAvg').textContent = '-';
  }
}

/* ── ADD PLAYER ── */
function compress(url, cb) {
  var img = new Image();
  img.onload = function() {
    var MAX = 160, w = img.width, h = img.height;
    if (w > h) { if (w > MAX) { h = Math.round(h*MAX/w); w = MAX; } }
    else        { if (h > MAX) { w = Math.round(w*MAX/h); h = MAX; } }
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(c.toDataURL('image/jpeg', 0.72));
  };
  img.src = url;
}

document.getElementById('btnAdd').addEventListener('click', function() {
  addPhoto = '';
  document.getElementById('addName').value = '';
  document.getElementById('addErr').textContent = '';
  document.getElementById('addPhotoFile').value = '';
  document.getElementById('addRing').innerHTML = '<div class="ph-ph"><span>&#128247;</span>Add photo</div>';
  document.getElementById('addModal').classList.add('open');
  setTimeout(function() { document.getElementById('addName').focus(); }, 150);
});

document.getElementById('addRing').addEventListener('click', function() {
  document.getElementById('addPhotoFile').click();
});

document.getElementById('addPhotoFile').addEventListener('change', function() {
  var file = this.files[0]; if (!file) return;
  var rd = new FileReader();
  rd.onload = function(ev) {
    compress(ev.target.result, function(c) {
      addPhoto = c;
      document.getElementById('addRing').innerHTML = '<img src="' + c + '">';
    });
  };
  rd.readAsDataURL(file);
});

document.getElementById('addName').addEventListener('input', function() {
  document.getElementById('addErr').textContent = '';
});
document.getElementById('addName').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doAdd();
});

document.getElementById('addCancel').addEventListener('click', function() {
  document.getElementById('addModal').classList.remove('open');
});

document.getElementById('addSave').addEventListener('click', doAdd);

document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

function doAdd() {
  var name = document.getElementById('addName').value.trim();
  if (!name) { document.getElementById('addErr').textContent = 'Please enter a name.'; return; }
  for (var i = 0; i < players.length; i++) {
    if (players[i].toLowerCase() === name.toLowerCase()) {
      document.getElementById('addErr').textContent = 'Player already exists.'; return;
    }
  }
  players.push(name);
  if (addPhoto) photos[name] = addPhoto;
  document.getElementById('addModal').classList.remove('open');
  buildGrid();
  updateStats();
  showToast(name + ' added!');
  setTimeout(function() {
    var last = document.getElementById('card' + (players.length - 1));
    if (last) last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

/* ── EXPORT CSV ── */
document.getElementById('btnCsv').addEventListener('click', function() {
  var keys = Object.keys(subs);
  if (!keys.length) { showToast('No submissions yet!'); return; }
  var arr = [];
  for (var k in subs) arr.push(subs[k]);
  arr.sort(function(a,b) { return a.name < b.name ? -1 : 1; });
  var csv = 'Date,Player Name,RPE Value,RPE Label\n';
  for (var i = 0; i < arr.length; i++) {
    var s = arr[i];
    csv += s.date + ',' + s.name + ',' + s.rpe + ',' + s.label + '\n';
  }
  var blob = new Blob([csv], { type: 'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'QFA_RPE_' + document.getElementById('dateInput').value + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV exported!');
});

/* ── TOAST ── */
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = '#00a850';
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

/* ── INIT ── */
buildGrid();
</script>
</body>
</html>
